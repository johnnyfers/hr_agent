<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Grupo Sazón — Screening</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root {
    --bg: #f7f5f1;
    --card: #fff;
    --primary: #c0392b;
    --primary-dark: #962b1f;
    --text: #1c1c1c;
    --muted: #777;
    --bubble-user: #c0392b;
    --bubble-bot: #ececec;
    --border: #e5e5e5;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .app {
    width: min(720px, 100%);
    height: min(820px, 100%);
    background: var(--card);
    display: flex;
    flex-direction: column;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    overflow: hidden;
  }
  header {
    background: var(--primary);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .status { font-size: 12px; opacity: 0.85; }
  .controls {
    display: flex;
    gap: 8px;
    padding: 8px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .controls select, .controls button {
    font-size: 13px;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
  }
  .controls button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #fafafa;
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.4;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.assistant {
    background: var(--bubble-bot);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .msg.user {
    background: var(--bubble-user);
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .typing {
    align-self: flex-start;
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
  }
  form {
    display: flex;
    border-top: 1px solid var(--border);
    background: #fff;
  }
  input[type=text] {
    flex: 1;
    padding: 14px 16px;
    border: none;
    font-size: 15px;
    outline: none;
  }
  button[type=submit], .voice-btn {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 0 18px;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.15s;
  }
  button[type=submit]:hover, .voice-btn:hover { background: var(--primary-dark); }
  button[type=submit]:disabled { background: #ccc; cursor: not-allowed; }
  .voice-btn { border-left: 1px solid var(--primary-dark); padding: 0 14px; }
  .voice-btn.listening { background: #e74c3c; animation: pulse 1.2s infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }
  .summary-panel {
    border-top: 2px solid var(--primary);
    background: #fff8f6;
    padding: 16px 20px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    max-height: 200px;
    overflow-y: auto;
  }
  .summary-panel h3 { margin: 0 0 8px 0; font-size: 14px; color: var(--primary); }
  .decision-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    margin-left: 8px;
  }
  .decision-qualified { background: #2ecc71; color: #fff; }
  .decision-disqualified { background: #95a5a6; color: #fff; }
  .decision-review { background: #f39c12; color: #fff; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Grupo Sazón — Repartidores</h1>
    <span class="status" id="status">conectando…</span>
  </header>
  <div class="controls">
    <label>Idioma:</label>
    <select id="lang">
      <option value="es">Español</option>
      <option value="en">English</option>
    </select>
    <button id="restart">↻ Nueva conversación</button>
    <button id="show-state">Ver estado</button>
  </div>
  <div class="messages" id="messages"></div>
  <form id="chat-form" autocomplete="off">
    <input type="text" id="input" placeholder="Escribe tu respuesta…" required />
    <button type="button" class="voice-btn" id="voice-btn" title="Voz (browser STT)">🎤</button>
    <button type="submit" id="send">Enviar</button>
  </form>
  <div id="summary" class="summary-panel" style="display:none;"></div>
</div>

<script>
const el = (id) => document.getElementById(id);
const messagesEl = el("messages");
const inputEl = el("input");
const sendBtn = el("send");
const statusEl = el("status");
const langEl = el("lang");
const summaryEl = el("summary");
const voiceBtn = el("voice-btn");

let conversationId = null;
let done = false;
let voiceOutput = false;

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  if (role === "assistant" && voiceOutput) speak(text);
}

function showTyping() {
  const div = document.createElement("div");
  div.className = "typing";
  div.id = "typing";
  div.textContent = "…";
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function clearTyping() {
  const t = el("typing");
  if (t) t.remove();
}

async function startConversation() {
  done = false;
  summaryEl.style.display = "none";
  messagesEl.innerHTML = "";
  inputEl.disabled = false;
  sendBtn.disabled = false;
  const res = await fetch("/api/conversations", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ language: langEl.value }),
  });
  if (!res.ok) {
    statusEl.textContent = "error iniciando";
    return;
  }
  const data = await res.json();
  conversationId = data.conversation_id;
  statusEl.textContent = `id: ${conversationId.slice(0, 8)}…`;
  addMessage("assistant", data.greeting);
}

async function sendMessage(text) {
  if (!conversationId || done) return;
  addMessage("user", text);
  inputEl.value = "";
  sendBtn.disabled = true;
  showTyping();

  try {
    const res = await fetch(`/api/conversations/${conversationId}/turn`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    clearTyping();
    if (!res.ok) {
      const err = await res.text();
      addMessage("assistant", `(error: ${err})`);
      return;
    }
    const data = await res.json();
    addMessage("assistant", data.reply);
    if (data.guardrail_flag) {
      console.info("guardrail:", data.guardrail_flag);
    }
    if (data.done) {
      done = true;
      inputEl.disabled = true;
      sendBtn.disabled = true;
      await fetchSummary(data.state);
    }
  } catch (e) {
    clearTyping();
    addMessage("assistant", `(connection error)`);
  } finally {
    sendBtn.disabled = done;
  }
}

async function fetchSummary(state) {
  const res = await fetch(`/api/conversations/${conversationId}/summary`, {
    method: "POST",
  });
  if (!res.ok) return;
  const data = await res.json();
  let badgeClass = "decision-review";
  if (state.decision === "qualified") badgeClass = "decision-qualified";
  else if (state.decision.startsWith("disqualified")) badgeClass = "decision-disqualified";
  summaryEl.style.display = "block";
  summaryEl.innerHTML =
    `<h3>Resumen para reclutador <span class="decision-badge ${badgeClass}">${state.decision}</span></h3>` +
    `<div></div>`;
  summaryEl.querySelector("div").textContent = data.summary;
}

el("chat-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = inputEl.value.trim();
  if (text) sendMessage(text);
});

el("restart").addEventListener("click", startConversation);

el("show-state").addEventListener("click", async () => {
  if (!conversationId) return;
  const res = await fetch(`/api/conversations/${conversationId}`);
  const data = await res.json();
  alert(JSON.stringify(data.state, null, 2));
});

// Browser-based voice (Web Speech API). Free, works in Chrome/Edge.
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;

  voiceBtn.addEventListener("click", () => {
    if (voiceBtn.classList.contains("listening")) {
      recognition.stop();
      return;
    }
    recognition.lang = langEl.value === "en" ? "en-US" : "es-ES";
    voiceOutput = true;
    voiceBtn.classList.add("listening");
    recognition.start();
  });

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    inputEl.value = transcript;
    sendMessage(transcript);
  };
  recognition.onend = () => voiceBtn.classList.remove("listening");
  recognition.onerror = () => voiceBtn.classList.remove("listening");
} else {
  voiceBtn.style.display = "none";
}

function speak(text) {
  if (!window.speechSynthesis) return;
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = langEl.value === "en" ? "en-US" : "es-ES";
  utter.rate = 1.05;
  speechSynthesis.speak(utter);
}

startConversation();
</script>
</body>
</html>
